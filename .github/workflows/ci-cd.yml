name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      confirmed_local_tests:
        description: 'I confirm that I have run all integration tests locally and they passed'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
 
jobs:
  changelog:
    name: Changelog contains version heading
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Skip (not a release/hotfix PR to main)
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix/'))) }}
        run: echo "Changelog check skipped (only enforced for release/* and hotfix/* PRs targeting main)."

      - name: Verify CHANGELOG.md is updated for package.json version
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'hotfix/')) }}
        run: node scripts/check-changelog-version.mjs

  lint:
    needs: [changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run linting
        run: npm run lint && npm run lint:md

  format:
    needs: [changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run format check
        run: npm run format:check

  test:
    needs: [format, lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x, 25.x]
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true

  integration:
    name: Integration Tests
    needs: [test]
    if: ${{ needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Verify classic log fixtures exist
        shell: bash
        run: |
          set -euo pipefail
          test -f "./test/fixtures/sample-pvss_ii.log"
          test -f "./test/fixtures/sample-syntax-check-PVSS_II.log"
          test -f "./test/fixtures/sample-quick-fail-PVSS_II.log"
          test -f "./test/fixtures/sample-test-runner-PVSS_II.log"
      - name: Run integration tests (CLI + fixtures)
        run: npm run test:integration

  required:
    name: CI/CD Pipeline - Required
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - lint
      - format
      - test
      - integration
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          RESULTS=(
            "lint:${{ needs.lint.result }}"
            "format:${{ needs.format.result }}"
            "test:${{ needs.test.result }}"
            "integration:${{ needs['integration'].result }}"
          )
          echo "Job results:"
          printf ' - %s\n' "${RESULTS[@]}"
          FAIL=0
          for r in "${RESULTS[@]}"; do
            status="${r#*:}"
            case "$status" in
              success|skipped)
                ;;
              *)
                echo "::error::Required job did not succeed: $r"
                FAIL=1
                ;;
            esac
          done
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
